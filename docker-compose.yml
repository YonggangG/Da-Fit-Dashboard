services:
  dafit-health-dashboard:
    build: .
    image: dafit-health-dashboard:latest
    container_name: dafit-health-dashboard
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      DAFIT_DATA_DIR: /data
    volumes:
      - dafit_health_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  dafit_health_data:
